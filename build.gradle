plugins {
    id 'fabric-loom' version '1.6.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config for configuration GUI
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modImplementation "me.shedaniel:architectury:${project.architectury_version}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pvprefined" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "fabric_loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "fabric_loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename it, "LICENSE_${project.archivesBaseName}"
    }
}

publishingLoom {
    changelog = "A client-side Fabric mod for competitive PvP servers. Fixes vanilla bugs, resolves desync issues, and provides QoL improvements."
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "PvPRefinedRepo"
            url = layout.buildDirectory.dir("repo")
        }
    }
}
